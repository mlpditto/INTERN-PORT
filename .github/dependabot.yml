version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/functions"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    ignore:
      # firebase-admin majors are suppressed because admin 14 carries runtime
      # breaking changes against code written for 13 — moving to it is a
      # deliberate, tested upgrade across the deployed functions, not a
      # Dependabot auto-merge. Patch and minor bumps still come through.
      #
      # NOT a peer-range problem any more: firebase-functions 7.3.0 added
      # ^14.0.0 to peerDependencies.firebase-admin and this repo is on 7.3.2,
      # so the old ERESOLVE-on-npm-ci blocker no longer applies.
      #
      # Remove this block when the admin 14 upgrade is scheduled and testable.
      - dependency-name: "firebase-admin"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
