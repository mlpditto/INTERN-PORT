name: Deploy to GitHub Pages

on:
  push:
    branches: [ production ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

# Opt into Node.js 24 ahead of GitHub Actions Node 20 deprecation (effective 2026-09-16).
# Removes warning: "Node.js 20 actions are deprecated".
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      # 🔥 Fix regex corruption before deploy
      - name: Fix Regex Corruption
        run: |
          python scripts/fix-regex.py || echo "No corruption found or script not available"
          git diff --quiet || (git config user.name "github-actions" && git config user.email "actions@github.com" && git add -A && git commit -m "ci: Auto-fix regex corruption" || true)

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Disable Jekyll
        run: touch public/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: 'public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
