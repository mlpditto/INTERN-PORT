<!-- Laboon AI Transcript Generation Workflow Mockup -->
<div class="laboon-transcript-workflow" style="max-width:600px;margin:auto;padding:2em;background:#fff;border-radius:16px;box-shadow:0 2px 12px #0001;">
  <!-- Step 1: Paste Content -->
  <h2>Step 1: Paste Content</h2>
  <textarea style="width:100%;min-height:100px;resize:vertical;" placeholder="Paste your script or meeting notes here…"></textarea>
  <hr>
  <!-- Step 2: AI Model Selection -->
  <h2>Step 2: AI Model Selection</h2>
  <label><input type="radio" name="ai-model" checked> Flash <span title="Fast, basic model">🛈</span></label>
  <label style="margin-left:1em;"><input type="radio" name="ai-model"> Pro <span title="High quality, slower">🛈</span></label>
  <label style="margin-left:1em;"><input type="radio" name="ai-model"> GPT <span title="OpenAI GPT model">🛈</span></label>
  <label style="margin-left:1em;"><input type="radio" name="ai-model"> Claude <span title="Anthropic Claude model">🛈</span></label>
  <hr>
  <!-- Step 3: Dialogue/Voice Settings -->
  <h2>Step 3: Dialogue/Voice Settings</h2>
  <label><input type="radio" name="dialogue-mode" checked> Single Speaker</label>
  <label style="margin-left:1em;"><input type="radio" name="dialogue-mode"> Dialogue (2 Speakers)</label>
  <div class="dialogue-settings" style="margin-top:1em;">
    <div style="margin-bottom:0.5em;">
      <strong>Speaker 1:</strong>
      <input type="text" placeholder="Name/Label" style="width:100px;">
      <select><option>Male</option><option>Female</option></select>
      <select><option>Thai</option><option>English</option></select>
    </div>
    <div style="margin-bottom:0.5em;">
      <strong>Speaker 2:</strong>
      <input type="text" placeholder="Name/Label" style="width:100px;">
      <select><option>Male</option><option>Female</option></select>
      <select><option>Thai</option><option>English</option></select>
    </div>
    <div>
      <label>Performance Notes:</label><br>
      <textarea style="width:100%;min-height:40px;resize:vertical;" placeholder="e.g. Warm, clear, confident"></textarea>
    </div>
  </div>
  <hr>
  <!-- Step 4: Generate Transcript -->
  <h2>Step 4: Generate Transcript</h2>
  <button style="padding:0.5em 2em;font-size:1.1em;">Generate Transcript</button>
  <div class="loading" style="display:none;margin-top:1em;">Generating…</div>
  <div class="transcript-preview" style="margin-top:1em;background:#f8f8f8;padding:1em;border-radius:8px;min-height:60px;">Transcript will appear here.</div>
</div>
