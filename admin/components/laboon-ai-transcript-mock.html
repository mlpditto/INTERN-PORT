<!-- Grand Line Deck - Laboon: AI Transcript Generation UI (Phase 1) -->
<div id="laboon-ai-transcript" style="max-width:700px;margin:40px auto 0 auto;padding:32px 24px;background:#fff;border-radius:24px;box-shadow:0 8px 32px rgba(0,0,0,0.08);font-family:'Inter',sans-serif;">
  <h2 style="margin-top:0;color:#1e293b;font-size:2em;font-weight:900;">AI Transcript Generator</h2>
  <!-- Step 1: Paste Content -->
  <div style="margin-bottom:28px;">
    <label for="ai-transcript-input" style="font-weight:700;font-size:1.1em;">Paste Content</label>
    <textarea id="ai-transcript-input" placeholder="Paste your script, meeting notes, or content here…" style="width:100%;min-height:120px;font-size:1.1em;padding:16px;border-radius:12px;border:1.5px solid #e5e7eb;margin-top:8px;"></textarea>
  </div>
  <!-- Step 2: AI Model & Dialogue Settings -->
  <div style="display:flex;gap:24px;flex-wrap:wrap;margin-bottom:24px;">
    <div style="flex:1 1 180px;min-width:180px;">
      <label style="font-weight:700;">AI Model</label><br>
      <select id="ai-model-select" style="width:100%;padding:8px 12px;border-radius:8px;border:1.5px solid #e5e7eb;font-size:1em;">
        <option value="flash">Flash</option>
        <option value="pro">Pro</option>
        <option value="gpt">GPT</option>
        <option value="claude">Claude</option>
      </select>
    </div>
    <div style="flex:1 1 180px;min-width:180px;">
      <label style="font-weight:700;">Dialogue Mode</label><br>
      <select id="ai-dialogue-mode" style="width:100%;padding:8px 12px;border-radius:8px;border:1.5px solid #e5e7eb;font-size:1em;">
        <option value="single">Single Speaker</option>
        <option value="dialogue">Dialogue (2 Speakers)</option>
      </select>
    </div>
  </div>
  <div id="ai-speaker-settings" style="display:flex;gap:24px;flex-wrap:wrap;margin-bottom:24px;">
    <div style="flex:1 1 180px;min-width:180px;">
      <label style="font-weight:700;">Speaker 1 Voice</label><br>
      <select style="width:100%;padding:8px 12px;border-radius:8px;border:1.5px solid #e5e7eb;font-size:1em;">
        <option>Korean Male</option>
        <option>Thai Female</option>
        <option>English Male</option>
      </select>
      <label style="font-weight:700;margin-top:8px;display:block;">Language</label>
      <select style="width:100%;padding:8px 12px;border-radius:8px;border:1.5px solid #e5e7eb;font-size:1em;">
        <option>Thai</option>
        <option>English</option>
      </select>
    </div>
    <div id="ai-speaker2-settings" style="flex:1 1 180px;min-width:180px;display:none;">
      <label style="font-weight:700;">Speaker 2 Voice</label><br>
      <select style="width:100%;padding:8px 12px;border-radius:8px;border:1.5px solid #e5e7eb;font-size:1em;">
        <option>Korean Male</option>
        <option>Thai Female</option>
        <option>English Male</option>
      </select>
      <label style="font-weight:700;margin-top:8px;display:block;">Language</label>
      <select style="width:100%;padding:8px 12px;border-radius:8px;border:1.5px solid #e5e7eb;font-size:1em;">
        <option>Thai</option>
        <option>English</option>
      </select>
    </div>
    <div style="flex:2 1 240px;min-width:220px;">
      <label style="font-weight:700;">Performance Notes</label>
      <textarea id="ai-performance-notes" placeholder="e.g. Warm, clear, confident narration…" style="width:100%;min-height:48px;font-size:1em;padding:10px;border-radius:8px;border:1.5px solid #e5e7eb;margin-top:8px;"></textarea>
    </div>
  </div>
  <!-- Step 3: Generate Transcript -->
  <div style="margin-bottom:24px;">
    <button id="ai-generate-transcript" style="padding:12px 36px;font-size:1.1em;font-weight:900;border-radius:12px;background:linear-gradient(135deg,#6366f1,#a855f7);color:#fff;border:none;box-shadow:0 4px 16px rgba(99,102,241,0.12);cursor:pointer;">Generate Transcript</button>
    <span id="ai-transcript-loading" style="display:none;margin-left:18px;color:#6366f1;font-weight:700;">Generating…</span>
  </div>
  <!-- Step 4: Preview Area -->
  <div id="ai-transcript-preview" style="display:none;background:#f8fafc;border-radius:12px;padding:18px 16px;font-size:1.1em;color:#1e293b;min-height:60px;margin-bottom:12px;"></div>
</div>
<script>
// Toggle Speaker 2 settings
const dialogueMode = document.getElementById('ai-dialogue-mode');
const speaker2 = document.getElementById('ai-speaker2-settings');
dialogueMode.addEventListener('change', function() {
  speaker2.style.display = this.value === 'dialogue' ? '' : 'none';
});
// Mock Generate Transcript
const genBtn = document.getElementById('ai-generate-transcript');
const loading = document.getElementById('ai-transcript-loading');
const preview = document.getElementById('ai-transcript-preview');
genBtn.onclick = function() {
  loading.style.display = '';
  preview.style.display = 'none';
  setTimeout(() => {
    loading.style.display = 'none';
    preview.style.display = '';
    preview.innerText = 'This is a mock transcript generated by AI. (Replace with real API integration in next phase.)';
  }, 1200);
};
</script>

<!-- Phase 2: Send to Podcast Studio Modal -->
<div id="laboon-send-podcast-modal" style="display:none;position:fixed;top:0;left:0;width:100vw;height:100vh;background:rgba(30,41,59,0.18);z-index:9999;align-items:center;justify-content:center;">
  <div style="background:#fff;border-radius:20px;box-shadow:0 8px 32px rgba(0,0,0,0.12);padding:32px 28px;max-width:420px;width:95vw;">
    <h3 style="margin-top:0;color:#1e293b;font-size:1.3em;font-weight:900;">Send to Podcast Studio</h3>
    <label style="font-weight:700;">Episode Title</label>
    <input id="podcast-ep-title" type="text" style="width:100%;padding:8px 12px;border-radius:8px;border:1.5px solid #e5e7eb;font-size:1em;margin-bottom:12px;">
    <label style="font-weight:700;">Description</label>
    <textarea id="podcast-ep-desc" style="width:100%;min-height:48px;font-size:1em;padding:10px;border-radius:8px;border:1.5px solid #e5e7eb;margin-bottom:12px;"></textarea>
    <label style="font-weight:700;">Cover Image URL</label>
    <input id="podcast-ep-cover" type="text" placeholder="https://..." style="width:100%;padding:8px 12px;border-radius:8px;border:1.5px solid #e5e7eb;font-size:1em;margin-bottom:12px;">
    <label style="font-weight:700;">Transcript Preview</label>
    <div id="podcast-ep-transcript" style="background:#f8fafc;border-radius:8px;padding:10px 12px;font-size:1em;color:#1e293b;min-height:40px;margin-bottom:18px;max-height:120px;overflow:auto;"></div>
    <div style="display:flex;gap:12px;justify-content:flex-end;">
      <button onclick="closePodcastModal()" style="padding:8px 18px;border-radius:8px;background:#e5e7eb;color:#334155;border:none;font-weight:700;">Cancel</button>
      <button id="podcast-ep-confirm" style="padding:8px 18px;border-radius:8px;background:linear-gradient(135deg,#22c55e,#16a34a);color:#fff;border:none;font-weight:900;">Confirm & Create Episode</button>
    </div>
  </div>
</div>
<!-- Add Send to Podcast Studio button below preview -->
<button id="laboon-send-podcast-btn" style="display:none;margin-bottom:24px;padding:10px 32px;font-size:1.05em;font-weight:900;border-radius:12px;background:linear-gradient(135deg,#f59e42,#fbbf24);color:#fff;border:none;box-shadow:0 2px 8px rgba(251,191,36,0.12);cursor:pointer;">Send to Podcast Studio</button>
<script>
// Show/hide Send to Podcast button
const previewDiv = document.getElementById('ai-transcript-preview');
const sendBtn = document.getElementById('laboon-send-podcast-btn');
const modal = document.getElementById('laboon-send-podcast-modal');
const transcriptDiv = document.getElementById('podcast-ep-transcript');
const confirmBtn = document.getElementById('podcast-ep-confirm');
function closePodcastModal() { modal.style.display = 'none'; }
// Show button when transcript is generated
const origGen = genBtn.onclick;
genBtn.onclick = function() {
  origGen();
  setTimeout(() => { if(preview.style.display!=='none'){ sendBtn.style.display=''; } }, 1300);
};
// Open modal and fill transcript
sendBtn.onclick = function() {
  transcriptDiv.innerText = previewDiv.innerText;
  modal.style.display = 'flex';
};
// Confirm & mock create episode
confirmBtn.onclick = function() {
  modal.style.display = 'none';
  sendBtn.style.display = 'none';
  previewDiv.style.display = 'none';
  showToast('Episode created in Podcast Studio!');
};
// Simple toast
function showToast(msg) {
  let t = document.createElement('div');
  t.innerText = msg;
  t.style = 'position:fixed;bottom:32px;left:50%;transform:translateX(-50%);background:#22c55e;color:#fff;padding:14px 32px;border-radius:12px;font-weight:900;font-size:1.1em;z-index:99999;box-shadow:0 2px 12px rgba(34,197,94,0.18);';
  document.body.appendChild(t);
  setTimeout(()=>t.remove(),2200);
}
</script>

<!-- Phase 3: Mini Firebase Storage Card -->
<div id="firebase-storage-mini" style="position:fixed;bottom:28px;left:28px;z-index:10000;display:flex;align-items:center;gap:8px;background:#fff;color:#0284c7;border-radius:12px;box-shadow:0 2px 8px rgba(2,132,199,0.08);padding:8px 16px;cursor:pointer;transition:box-shadow 0.2s;">
  <i class="fa-solid fa-database"></i>
  <span style="font-size:0.9em;font-weight:700;">Storage</span>
</div>
<div id="firebase-storage-card" style="display:none;position:fixed;bottom:70px;left:28px;z-index:10001;background:#f8fafc;border-radius:16px;box-shadow:0 4px 24px rgba(2,132,199,0.13);padding:22px 28px;min-width:260px;">
  <div style="font-weight:900;font-size:1.1em;color:#0284c7;margin-bottom:8px;">Firebase Storage</div>
  <div id="firebase-storage-usage" style="font-size:1em;color:#334155;margin-bottom:8px;">Loading…</div>
  <div style="height:8px;background:#e0f2fe;border-radius:6px;overflow:hidden;margin-bottom:10px;">
    <div id="firebase-storage-bar" style="height:100%;background:linear-gradient(90deg,#38bdf8,#0ea5e9);width:0%;transition:width 0.5s;"></div>
  </div>
  <div style="font-size:0.9em;color:#64748b;margin-bottom:10px;">Free tier: 5 GB • 3 files</div>
  <button id="firebase-storage-refresh" style="padding:6px 18px;border-radius:8px;background:#0284c7;color:#fff;border:none;font-weight:700;">Refresh</button>
</div>
<script>
const mini = document.getElementById('firebase-storage-mini');
const card = document.getElementById('firebase-storage-card');
const usage = document.getElementById('firebase-storage-usage');
const bar = document.getElementById('firebase-storage-bar');
const refreshBtn = document.getElementById('firebase-storage-refresh');
let storageMock = { used: 0, quota: 5120, files: 3 };
function showCard() {
  card.style.display = '';
  updateStorageCard();
}
function hideCard() { card.style.display = 'none'; }
mini.onclick = showCard;
card.onclick = (e) => { if(e.target===card) hideCard(); };
document.addEventListener('keydown',e=>{if(e.key==='Escape')hideCard();});
function updateStorageCard() {
  usage.innerText = `${(storageMock.used/1024).toFixed(2)} MB used / ${(storageMock.quota/1024).toFixed(0)} MB (${storageMock.files} files)`;
  bar.style.width = `${Math.min(100,100*storageMock.used/storageMock.quota)}%`;
}
refreshBtn.onclick = function() {
  usage.innerText = 'Refreshing…';
  setTimeout(()=>{
    // Mock: randomize usage
    storageMock.used = Math.floor(Math.random()*storageMock.quota*0.8);
    storageMock.files = 1+Math.floor(Math.random()*6);
    updateStorageCard();
  }, 800);
};
// Hide card when click outside
window.addEventListener('mousedown',e=>{if(card.style.display!==''||!card.contains(e.target)&&e.target!==mini)hideCard();});
</script>
